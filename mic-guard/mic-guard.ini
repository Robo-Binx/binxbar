; Binxbar mic guard settings

; Words that identify YOUR main mic in its Windows device name (comma separated, not case sensitive).
; Find the name in Windows: Settings > System > Sound > Input. Example: "Microphone (2- Yeti Stereo Microphone)" -> yeti
MainMic=CHANGE_ME

; Where iCUE installed the Binxbar widget. This is the default; only change it if you renamed the widget id.
WidgetFolder=%APPDATA%\Corsair\CUE5\html_widgets\com\personal\binxbar

; Discord server whose voice channels the tile shows ("who's in the Lounge").
; Turn on Server Settings > Engagement > Server Widget in that server, then paste its Server ID here. Leave empty to turn this off.
LoungeServerId=

; Google Calendar (view only). Google Calendar > Settings > your calendar > Integrate calendar >
; "Secret address in iCal format". Paste it after the = . For more than one calendar, put a space between the links.
; Keep these links private: anyone with one can read that calendar.
; Leave empty to turn calendar sync off.
CalendarUrl=

; Phone alerts through Microsoft Phone Link (Android or iPhone linked to this PC). See docs/phone.md.
; Texts from these people take over the tile: names exactly as saved in your phone's contacts, comma separated.
; Put * to let every text through (then pick who pops up with the bell on each contact in Binxbar's PHONE app).
; Leave empty for no text alerts. Message text is never shown or stored, only who it's from.
PhoneAlertsFrom=
; on = any incoming call takes over the tile, with ANSWER / DECLINE (and CALL BACK for missed calls). off = no call alerts.
PhoneCalls=off
