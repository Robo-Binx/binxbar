<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tr('Binxbar')</title>
    <link rel="icon" type="image/svg+xml" href="resources/icon.svg" />
    
    <meta name="x-icue-info" content="appStatus" data-label="tr('App Status')" data-type="app-status" data-default="" application="stream-deck" />
    <meta name="x-icue-property" content="virtualDevice" data-label="tr('Tap-to-Mute Device')" data-type="stream-deck-virtual-device" />
    <meta name="x-icue-property" content="micName" data-label="tr('Microphone Name Contains')" data-type="textfield" data-default="''" />
    <meta name="x-icue-property" content="myDiscordName" data-label="tr('Your Discord Name (shown as YOU in Lounge)')" data-type="textfield" data-default="''" />
    <meta name="x-icue-property" content="joinChannels" data-label="tr('Tap-to-Join Channels (comma separated, in key order)')" data-type="textfield" data-default="''" />
    <meta name="x-icue-property" content="showMobile" data-label="tr('GO MOBILE Button')" data-type="switch" data-default="true" />
    <meta name="x-icue-property" content="mobileMicName" data-label="tr('Mobile Mode Mic Name Contains')" data-type="textfield" data-default="''" />
    <meta name="x-icue-property" content="muteThreshold" data-label="tr('Mute Sensitivity')" data-type="slider" data-default="-81" data-min="-140" data-max="-30" data-step="1" data-unit-label="'dB'" />
    <meta name="x-icue-property" content="clockFace" data-label="tr('Face')" data-type="tab-buttons"
        data-default="'salvage'" data-values="[{'key':'salvage','value':'Salvage'},{'key':'flip','value':'Flip'},{'key':'nixie','value':'Nixie'},{'key':'vfd','value':'Fluorescent'}]" />
    <meta name="x-icue-property" content="clockFormat" data-label="tr('Format')" data-type="tab-buttons"
        data-default="'12h'" data-values="[{'key':'24h','value':'24h'},{'key':'12h','value':'12h'}]" />
    <meta name="x-icue-property" content="clockSeconds" data-label="tr('Seconds')" data-type="switch"
        data-default="false" />
    <meta name="x-icue-property" content="clockDate" data-label="tr('Date')" data-type="switch"
        data-default="true" />
    <meta name="x-icue-property" content="showWeather" data-label="tr('Weather')" data-type="switch" data-default="true" />
    <meta name="x-icue-property" content="weatherCity" data-label="tr('City')" data-type="textfield" data-default="'New York, NY'" />
    <meta name="x-icue-property" content="weatherUnits" data-label="tr('Units')" data-type="tab-buttons" data-default="'F'" data-values="[{'key':'F','value':'F'},{'key':'C','value':'C'}]" />
    <meta name="x-icue-property" content="mapKey" data-label="tr('Radar Map Key (free, carto.com/basemaps/apikey)')" data-type="textfield" data-default="''" />
    <meta name="x-icue-property" content="calendarUrl" data-label="tr('Google Calendar iCal Link')" data-type="textfield" data-default="''" />
    <meta name="x-icue-property" content="textColor" data-label="tr('Text Color')" data-type="color"
        data-default="'#f2f3ed'" />
    <meta name="x-icue-property" content="accentColor" data-label="tr('Accent Color')" data-type="color"
        data-default="'#f7f8fb'" />
    <meta name="x-icue-property" content="backgroundColor" data-label="tr('Background Color')" data-type="color"
        data-default="'#080a0b'" />
    <meta name="x-icue-property" content="transparency" data-label="tr('Background Transparency')" data-type="slider"
        data-default="100" data-min="0" data-max="100" data-step="1" data-unit-label="'%'" />
    <meta name="x-icue-property" content="widgetStyle" data-label="tr('Style')" data-type="combobox"
        data-default="'instrument'" data-values="[{'key':'instrument','value':'Instrument'},{'key':'apple','value':'Apple'},{'key':'openai','value':'OpenAI'},{'key':'spacex','value':'SpaceX'},{'key':'nothing','value':'Nothing'},{'key':'anthropic','value':'Clay'},{'key':'google','value':'Google'},{'key':'terminal','value':'Terminal'},{'key':'corsair','value':'Corsair'},{'key':'aurora','value':'Aurora'},{'key':'paper','value':'Paper'},{'key':'brutalist','value':'Brutalist'},{'key':'synthwave','value':'Synthwave'},{'key':'abyss','value':'Abyss'},{'key':'sunset','value':'Sunset'},{'key':'newsprint','value':'Newsprint'},{'key':'blueprint','value':'Blueprint'},{'key':'forest','value':'Forest'},{'key':'pastel','value':'Pastel'},{'key':'amber','value':'Amber'},{'key':'hud','value':'HUD'},{'key':'bloomberg','value':'Bloomberg'}]" />
    <script type="application/json" id="x-icue-groups">
        [{ "title": "tr('Microphone')", "properties": ["virtualDevice", "appStatus", "micName", "myDiscordName", "joinChannels", "showMobile", "mobileMicName", "muteThreshold"] },
        { "title": "tr('Clock')", "properties": ["clockFace", "clockFormat", "clockSeconds", "clockDate", "showWeather", "weatherCity", "weatherUnits", "mapKey", "calendarUrl"] },
        { "title": "tr('Widget Personalization')", "properties": ["textColor", "accentColor", "backgroundColor", "transparency", "widgetStyle"] }]
    </script>
    <link rel="stylesheet" href="./styles/xeneon-widget.css" />
    <link rel="stylesheet" href="./styles/widget-styles.css" />
    <link rel="stylesheet" href="./styles/salvage.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/hub.css" />
    <script src="./scripts/icue-events-bridge.js"></script>
</head>

<body>
    <main id="widget" class="x-widget" data-face="salvage" data-view="now">
        <div class="hub-frame" aria-hidden="true"><span class="hf-line"></span><span class="hf-c tl"></span><span class="hf-c tr"></span><span class="hf-c bl"></span><span class="hf-c br"></span><span class="hf-dots l"></span><span class="hf-dots r"></span><span class="hf-bar"></span><span class="hf-grain"></span></div>
        <section class="mod-top" id="modTop">
        <div class="timebox">
            <div class="clock" id="clock" role="timer" aria-live="off"></div>
            <p class="date" id="date"></p>
        </div>
        <div class="wx" id="wx">
            <div class="wx-temp" id="wxTemp">--</div>
            <div class="wx-cond" id="wxCond">LOADING</div>
            <div class="wx-hl" id="wxHL"></div>
            <div class="wx-city" id="wxCity"></div>
        </div>
        </section>
        <section class="mod-row" id="modRow">
        <aside class="mobile-side">
            <div class="aud-btn aud-mob" id="audMob">
                <svg class="mob-icon guy" viewBox="0 0 32 32" aria-hidden="true">
                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19.3 9.9 22.4 6.6 24.9 3.1" stroke-width="2.4"/>
                        <path d="M14.9 10.4 11.6 12.9 9.2 11.2" stroke-width="2.4"/>
                        <path d="M15.6 17.6 12.4 20.6 11.2 22.4" stroke-width="3.4"/>
                        <path d="M17.2 17.4 20.4 19.8 21.4 21.4" stroke-width="3.4"/>
                    </g>
                    <circle cx="18.2" cy="5.3" r="2.8" fill="currentColor"/>
                    <path d="M14.4 9.6c1.6-.9 3.4-1.1 5.3-.6l.1 1.2-1.3 7.6-4.3-.4-.6-6.9z" fill="currentColor"/>
                    <path d="M14.6 9.4 13.1 11.6 15.6 10.6zM19.6 9.1 21.6 10.6 19.1 10.9z" fill="currentColor"/>
                    <path d="M13.8 17.1h4.7l.3 1.6-5.4.2z" fill="currentColor"/>
                    <path d="M10.2 21.4 12.6 22.6 14 29.2 6.4 29.4z" fill="currentColor"/>
                    <path d="M20 20.4 22.4 21.6 27.6 27.6 21.6 29.4z" fill="currentColor"/>
                    <rect x="6" y="29.4" width="8.4" height="1.5" rx="0.6" fill="currentColor"/>
                    <path d="M21.2 29.6 27.9 27.7 28.4 29.1 21.7 31z" fill="currentColor"/>
                </svg>


                <div class="mob-label" id="mobLabel">GO<br>MOBILE</div>
            </div>
            <div class="aud-btn aud-stream" id="audStream">
                <svg class="st-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2.5" y="4" width="19" height="13" rx="2"></rect>
                    <path d="M8 21h8M12 17v4"></path>
                    <path d="M10 8.2v5.6l4.8-2.8z" fill="currentColor" stroke="none"></path>
                </svg>
                <div class="st-label" id="stLabel">STREAM<br>GAME</div>
            </div>
            <div class="aud-btn aud-dc" id="audDc">
                <svg class="dc-icon" viewBox="1.5 6.5 21 11" fill="currentColor" aria-hidden="true">
                    <path d="M12 8.6c-3.4 0-6.6 1-9.1 2.9-.6.4-.8 1.2-.5 1.9l1.3 2.6c.3.6 1 .9 1.7.7l3.1-1c.6-.2 1-.8.9-1.4l-.2-1.9c1.8-.5 3.8-.5 5.6 0l-.2 1.9c-.1.6.3 1.2.9 1.4l3.1 1c.7.2 1.4-.1 1.7-.7l1.3-2.6c.3-.7.1-1.5-.5-1.9C18.6 9.6 15.4 8.6 12 8.6z"/>
                </svg>
                <div class="dc-label" id="dcLabel">DISCONNECT<br>DISCORD</div>
            </div>
        </aside>
        <div class="slides" id="slides" data-slide="0">
        <div class="mod-mic state-idle" id="modMic">
            <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="9" y="2.5" width="6" height="12" rx="3"></rect>
                <path d="M5 11a7 7 0 0 0 14 0"></path>
                <line x1="12" y1="18" x2="12" y2="21.5"></line>
                <line x1="8.5" y1="21.5" x2="15.5" y2="21.5"></line>
                <line class="slash" x1="3.5" y1="3" x2="20.5" y2="21"></line>
            </svg>
            <svg class="mic-guy guy" viewBox="0 0 32 32" aria-hidden="true">
                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19.3 9.9 22.4 6.6 24.9 3.1" stroke-width="2.4"/>
                        <path d="M14.9 10.4 11.6 12.9 9.2 11.2" stroke-width="2.4"/>
                        <path d="M15.6 17.6 12.4 20.6 11.2 22.4" stroke-width="3.4"/>
                        <path d="M17.2 17.4 20.4 19.8 21.4 21.4" stroke-width="3.4"/>
                    </g>
                    <circle cx="18.2" cy="5.3" r="2.8" fill="currentColor"/>
                    <path d="M14.4 9.6c1.6-.9 3.4-1.1 5.3-.6l.1 1.2-1.3 7.6-4.3-.4-.6-6.9z" fill="currentColor"/>
                    <path d="M14.6 9.4 13.1 11.6 15.6 10.6zM19.6 9.1 21.6 10.6 19.1 10.9z" fill="currentColor"/>
                    <path d="M13.8 17.1h4.7l.3 1.6-5.4.2z" fill="currentColor"/>
                    <path d="M10.2 21.4 12.6 22.6 14 29.2 6.4 29.4z" fill="currentColor"/>
                    <path d="M20 20.4 22.4 21.6 27.6 27.6 21.6 29.4z" fill="currentColor"/>
                    <rect x="6" y="29.4" width="8.4" height="1.5" rx="0.6" fill="currentColor"/>
                    <path d="M21.2 29.6 27.9 27.7 28.4 29.1 21.7 31z" fill="currentColor"/>
                </svg>


            <div class="mic-text">
                <div class="mic-hero" id="micHero">CHECKING</div>
                <div class="mic-sub" id="micSub"></div>
                <div class="mic-sub mic-sub2" id="micSub2"></div>
                <div class="mute2" id="mute2">MUTE 2ND MIC</div>
                <div class="tomainmic" id="toMainMic">SWITCH TO MIC</div>
            </div>
            <span class="mic-hazard"></span>
        </div>
        <div class="mod-bright" id="modBright">
            <div class="br-head">
                <svg class="br-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4.5"></line><line x1="12" y1="19.5" x2="12" y2="22"></line><line x1="2" y1="12" x2="4.5" y2="12"></line><line x1="19.5" y1="12" x2="22" y2="12"></line><line x1="4.9" y1="4.9" x2="6.7" y2="6.7"></line><line x1="17.3" y1="17.3" x2="19.1" y2="19.1"></line><line x1="4.9" y1="19.1" x2="6.7" y2="17.3"></line><line x1="17.3" y1="6.7" x2="19.1" y2="4.9"></line></svg>
                <div class="br-val" id="brVal">--</div>
                <button class="br-power on" id="brPower" aria-label="Monitor power">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7.5 5.8a8 8 0 1 0 9 0"></path><line x1="12" y1="2.5" x2="12" y2="11"></line></svg>
                </button>
            </div>
            <div class="br-steps" id="brSteps">
                <button data-v="10">10</button><button data-v="25">25</button><button data-v="50">50</button><button data-v="75">75</button><button data-v="100">100</button>
            </div>
        </div>
        <div class="slide-dots" id="slideDots"><i data-s="0"></i><i data-s="1"></i></div>
        </div>

        <aside class="audio-side">
            <div class="aud-btn aud-hp hp-on" id="audHp">
                <svg class="hp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3.5 18v-5a8.5 8.5 0 0 1 17 0v5"></path>
                    <rect x="3" y="14" width="4" height="6.5" rx="1.5"></rect>
                    <rect x="17" y="14" width="4" height="6.5" rx="1.5"></rect>
                    <line class="slash" x1="3" y1="3" x2="21" y2="21"></line>
                </svg>
                <div class="hp-label" id="hpLabel">ON</div>
            </div>
            <div class="aud-btn aud-all all-on" id="audAll">
                <div class="all-icons">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="21.5"></line></svg>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 18v-5a8.5 8.5 0 0 1 17 0v5"></path><rect x="3" y="14" width="4" height="6.5" rx="1.5"></rect><rect x="17" y="14" width="4" height="6.5" rx="1.5"></rect></svg>
                </div>
                <div class="all-label" id="allLabel">MUTE ALL</div>
            </div>
        </aside>
        </section>
        <section class="mod-lounge" id="modLounge"><div class="lg-bubbles" id="lgBubbles"></div></section>
        <section class="mod-music idle" id="modMusic">
            <div class="mu-mini" id="muMini"><svg class="mu-rec" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#121216" stroke="#4a4652" stroke-width="1"/><circle cx="16" cy="16" r="12" fill="none" stroke="#2c2a33" stroke-width="0.8"/><circle cx="16" cy="16" r="9.5" fill="none" stroke="#2c2a33" stroke-width="0.8"/><path d="M6.5 11.5A11 11 0 0 1 12 6" fill="none" stroke="#6f6a7a" stroke-width="1.2" stroke-linecap="round"/><circle cx="16" cy="16" r="5.6" fill="#a98be6"/><circle cx="16" cy="16" r="1.3" fill="#121216"/></svg><b>MUSIC</b><span id="muMiniSrc"></span></div>
            <div class="mu-art" id="muArt"></div>
            <div class="mu-text">
                <div class="mu-title" id="muTitle"></div>
                <div class="mu-sub" id="muSub"></div>
                <div class="mu-vol" id="muVol">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
                    <div class="mu-bar" id="muBar"><b id="muFill"></b><i id="muTarget"></i></div>
                    <span class="mu-num" id="muNum">--</span>
                </div>
            </div>
            <div class="mu-ctl">
                <div class="mu-btn" id="muPrev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2v14H7zM20 5v14L10 12z"></path></svg></div>
                <div class="mu-btn mu-play" id="muPlay"><svg class="ic-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"></path></svg><svg class="ic-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"></path></svg></div>
                <div class="mu-btn" id="muNext"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 5h2v14h-2zM4 5v14l10-7z"></path></svg></div>
            </div>
        </section>
        <div class="fc" id="fc"></div>
        <div class="cal" id="cal"></div>
    </main>
    <script src="./scripts/widget-runtime.js"></script>
    <script src="./scripts/app.js"></script>
    <script src="./scripts/radar.js"></script>
    <script src="./scripts/weather.js"></script>
    <script src="./scripts/calendar.js"></script>
    <script src="./scripts/mic.js"></script>
    <script src="./scripts/music.js"></script>
    <script src="./scripts/lounge.js"></script>
</body>

</html>
