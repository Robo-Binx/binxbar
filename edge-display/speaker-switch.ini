; Binxbar SPEAKER button: flips Windows sound between your headset and a speaker (Bluetooth or wired).
; Use a word from each device's name in Windows: Settings > System > Sound > Output. Not case sensitive.
; Example: "Speakers (Soundcore Motion 300)" -> Soundcore

; Your speaker. Leave as CHANGE_ME to turn the button off.
Speaker=CHANGE_ME

; Your headset, for switching back. Leave empty to go back to whatever you were using before.
Headset=

; Where iCUE installed the Binxbar widget (same as in mic-guard.ini).
WidgetFolder=%APPDATA%\Corsair\CUE5\html_widgets\com\personal\binxbar
