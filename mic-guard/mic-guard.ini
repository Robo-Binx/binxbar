; Binxbar mic guard settings

; Words that identify YOUR main mic in its Windows device name (comma separated, not case sensitive).
; Find the name in Windows: Settings > System > Sound > Input. Example: "Microphone (2- Yeti Stereo Microphone)" -> yeti
MainMic=CHANGE_ME

; Where iCUE installed the Binxbar widget. This is the default; only change it if you renamed the widget id.
WidgetFolder=%APPDATA%\Corsair\CUE5\html_widgets\com\personal\binxbar

; Discord server whose voice channels the tile shows ("who's in the Lounge").
; Turn on Server Settings > Engagement > Server Widget in that server, then paste its Server ID here. Leave empty to turn this off.
LoungeServerId=

; Google Calendar (view only). Google Calendar > Settings > your calendar > Integrate calendar >
; "Secret address in iCal format". Paste it after the = . Keep this link private: anyone with it can read your calendar.
; Leave empty to turn calendar sync off.
CalendarUrl=
