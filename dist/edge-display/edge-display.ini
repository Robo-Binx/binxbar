; Binxbar screen controls (brightness presets + power), using Twinkle Tray's command line.
; Get Twinkle Tray: https://twinkletray.com  (or: winget install twinkletray)

; Your Edge's MonitorID. Run list-monitors.bat, open monitors.txt, and copy the ID of the Xeneon Edge
; (its name contains "XENEON EDGE" or "CRXED"). A unique tail of the ID is enough, e.g. UID12345.
MonitorID=PUT_YOUR_EDGE_ID_HERE

; Where Twinkle Tray is installed (this is the default per-user install path).
TwinkleTray=%LocalAppData%\Programs\twinkle-tray\Twinkle Tray.exe
